name: Publish audited viewer image
on:
  workflow_dispatch:
    inputs:
      asset_sha256:
        description: SHA256 of the audited saved-image archive
        required: true
      config_digest:
        description: Accepted sha256 config digest binding runtime settings and ordered rootfs
        required: true
      source_sha:
        description: Source commit recorded in the tested image label
        required: true
      release_tag:
        description: Release containing the accepted archive; preserves earlier release assets
        required: false
        default: viewer-fixtures-v2
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - name: Retrieve exact accepted image, validate and smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_SHA: ${{ inputs.asset_sha256 }}
          EXPECTED_CONFIG: ${{ inputs.config_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag || 'viewer-fixtures-v2' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', os.environ['RELEASE_TAG'])
          PY
          gh release download "$RELEASE_TAG" --pattern viewer-image-amd64.tar.gz --dir /tmp/image --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['ARCHIVE_SHA'])
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ['EXPECTED_CONFIG'])
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_SHA'])
          p = pathlib.Path('/tmp/image/viewer-image-amd64.tar.gz')
          assert hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() == os.environ['ARCHIVE_SHA']
          PY
          python3 backend/scripts/check_saved_viewer_image.py --archive /tmp/image/viewer-image-amd64.tar.gz --tag matchpulse-viewer:release-amd64 --source "$SOURCE_SHA" --expected-config "$EXPECTED_CONFIG"
          docker load -i /tmp/image/viewer-image-amd64.tar.gz
          docker save matchpulse-viewer:release-amd64 -o /tmp/image/loaded.tar
          python3 backend/scripts/check_saved_viewer_image.py --archive /tmp/image/loaded.tar --tag matchpulse-viewer:release-amd64 --source "$SOURCE_SHA" --expected-config "$EXPECTED_CONFIG"
          docker run -d --name viewer --cpus=0.5 --memory=1g -p 127.0.0.1:8010:8010 matchpulse-viewer:release-amd64
          python3 backend/scripts/check_viewer_release.py --url http://127.0.0.1:8010
      - name: Publish to GHCR using short-lived repository token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/ansh0eman/matchpulse-viewer:$SOURCE_SHA"
          docker tag matchpulse-viewer:release-amd64 "$image"
          docker push "$image"
          docker logout ghcr.io
          printf 'Published tested source revision: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
